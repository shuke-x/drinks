name: tonight_drinks
description: 今晚喝什么 — 鸡尾酒酒单 App（毛玻璃设计，100% 还原 Claude Design 设计稿）
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 路由
  go_router: ^14.2.0
  # 网络（上线后对接 NestJS 后端）
  dio: ^5.4.0
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 本地持久化（我的酒单 / 计量单位）
  shared_preferences: ^2.2.3
  # 字体：Noto Serif SC / Playfair Display / Hanken Grotesk / DM Mono
  google_fonts: ^6.2.1
  # Phosphor 图标（设计稿使用 @phosphor-icons/web）
  phosphor_flutter: ^2.1.0
  # 系统相册多选与图片上传
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
