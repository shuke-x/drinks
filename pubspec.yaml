name: drinks
description: what's the next drink?
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # 路由
  go_router: ^14.2.0
  # 网络（上线后对接 NestJS 后端）
  dio: ^5.4.0
  http_parser: ^4.1.2
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 本地持久化（我的酒单 / 计量单位）
  shared_preferences: ^2.2.3
  # 品牌字体随应用本地打包，离线环境不发起运行时字体请求。
  # Phosphor 图标（设计稿使用 @phosphor-icons/web）
  phosphor_flutter: ^2.1.0
  cupertino_icons: ^1.0.8
  # 系统相册多选与图片上传
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  flutter_svg: ^2.2.4
  # 认证：RSA-OAEP(SHA-256) challenge 加密与安全 Token 存储
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  flutter_secure_storage: ^9.2.4
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/licenses/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-MediumItalic.ttf
          weight: 500
          style: italic
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
